name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist was generated
        run: |
          if [ ! -f dist/index.html ]; then
            echo '::error::dist/index.html no se generó'
            exit 1
          fi

      - name: Guard against stale canonical domain
        run: |
          if grep -rn 'portafolio.vercel.app' --include='*.html' --include='*.xml' --include='*.txt' --include='*.js' .; then
            echo '::error::quedaron URLs del dominio anterior'
            exit 1
          fi

      - name: Check dist is not committed
        run: |
          # dist/ está en .gitignore, así que `git status --porcelain dist`
          # siempre sale vacío: hay que mirar los archivos ignorados.
          if [ -n "$(git status --porcelain --ignored dist | grep '^!!')" ]; then
            echo '::error::dist/ está trackeado; debería estar solo en .gitignore'
            git status --porcelain --ignored dist
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run verification suites
        run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
